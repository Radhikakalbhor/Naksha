services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: naksha-postgres
    environment:
      POSTGRES_DB: naksha
      POSTGRES_USER: naksha
      POSTGRES_PASSWORD: naksha_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naksha -d naksha"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: naksha-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: naksha-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: naksha
      MINIO_ROOT_PASSWORD: naksha_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: naksha-titiler
    depends_on:
      minio:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ../../data:/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: naksha-api
    shm_size: "2gb"
    working_dir: /app
    volumes:
      - ../../backend:/app
      - ../../gis_engine:/app/gis_engine
      - ../../data:/data
      - ../../water_inference.py:/app/water_inference.py:ro
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    image: node:22-alpine
    container_name: naksha-frontend
    working_dir: /app
    volumes:
      - ../../frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data: